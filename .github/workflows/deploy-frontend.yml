name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:
    inputs:
      skip_api_check:
        description: "Ship without verifying API_URL (backend outage only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A wrong API_URL cannot be caught any later: it is inlined into the bundle
      # at *build* time, so a green build ships a SPA that talks to nothing. And
      # because *.onrender.com is a wildcard, a guessed or decommissioned host
      # answers with an ordinary 404 rather than failing DNS, so shape alone
      # proves nothing (issue #11).
      #
      # Its own step, before setup-node, for two reasons: the red X lands on the
      # thing that is actually broken — a repository variable — instead of on
      # "Build", and a misconfigured value fails in seconds rather than after a
      # cache restore, `npm ci` and `vite build`.
      - name: Verify API_URL serves a live Energlens API
        if: ${{ inputs.skip_api_check != true }}
        timeout-minutes: 10
        env:
          # By env, never interpolated into `run:`, and named for the repository
          # variable rather than VITE_* so the error names what you have to fix.
          API_URL: ${{ vars.API_URL }}
        run: scripts/api.sh preflight

      # A push cannot supply inputs, so the bypass is unreachable from the
      # automatic path — it takes a deliberate workflow_dispatch.
      #
      # It skips the *probe*, not the validation: `validate` is the offline half,
      # and a backend outage is no reason to ship a bundle pointed at an empty or
      # scheme-less URL. And it is never silent — the run carries a warning,
      # because a skipped check that leaves no trace is the same silent-drift
      # shape issue #11 is about.
      - name: Validate API_URL without probing it
        if: ${{ inputs.skip_api_check == true }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          scripts/api.sh validate
          echo "::warning::API_URL was NOT probed for this deploy (skip_api_check); only its shape was checked. Re-run the workflow once the backend answers."

      # Runs before the build so base_path can feed Vite's `base`. Emits
      # "/energlens" for a project site and "" behind a custom domain — append
      # a slash and both become valid Vite base paths.
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Set the API_URL repository variable to your hosted backend URL
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
        run: |
          # API_URL's shape *and* reachability are checked by "Verify API_URL"
          # above, which fails the job before this step runs. Do not re-add a
          # check here: one place owns that validation, and it is the one you can
          # also run locally, with `make api-preflight`.
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # Exposed so `smoke` can assert against the URL Pages actually published,
      # rather than a second copy of it that could drift behind a rename or a
      # custom domain.
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green build proves the bundle compiled, not that the published site loads.
  # PR #1 shipped a bundle that built cleanly and then 404'd every asset behind a
  # 200 index.html — a blank page that no build-time check can catch, because the
  # base path only becomes wrong once something serves it.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke-pages.sh "${{ needs.deploy.outputs.page_url }}"

  # This workflow runs on push to main, after the PR is gone, so it can never be
  # a required status check — a red run here blocks nothing and, before this job,
  # told nobody. It once sat red for five hours (issue #10).
  #
  # always(), not failure(): the job also has to close the issue when a later run
  # goes green, and a `failure()` guard would never let it see a success.
  alert:
    needs: [build, deploy, smoke]
    if: always()
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow block entirely, so the pages
    # and id-token grants deliberately do not reach this job.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci-alert.sh pages-deploy \
            "${{ join(needs.*.result, ' ') }}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
