name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before the build so base_path can feed Vite's `base`. Emits
      # "/energlens" for a project site and "" behind a custom domain — append
      # a slash and both become valid Vite base paths.
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Set the API_URL repository variable to your hosted backend URL
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
        run: |
          # Check the shape, not just emptiness: Render's dashboard shows the
          # bare host, and a scheme-less value would sail through a `test -n`
          # and then throw "Invalid URL" from new URL() on every request.
          case "$VITE_API_URL" in
            https://?*)
              ;;
            *)
              echo "::error::Repository variable API_URL must be an absolute https:// URL (got: '${VITE_API_URL:-<empty>}')."
              exit 1
              ;;
          esac
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
