name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:
    inputs:
      skip_api_check:
        description: "Ship without verifying API_URL (backend outage only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A wrong API_URL cannot be caught any later: it is inlined into the bundle
      # at *build* time, so a green build ships a SPA that talks to nothing. And
      # because *.onrender.com is a wildcard, a guessed or decommissioned host
      # answers with an ordinary 404 rather than failing DNS, so shape alone
      # proves nothing (issue #11).
      #
      # Its own step, before setup-node, for two reasons: the red X lands on the
      # thing that is actually broken — a repository variable — instead of on
      # "Build", and a misconfigured value fails in seconds rather than after a
      # cache restore, `npm ci` and `vite build`.
      - name: Verify API_URL serves a live Energlens API
        if: ${{ inputs.skip_api_check != true }}
        timeout-minutes: 10
        env:
          # By env, never interpolated into `run:`, and named for the repository
          # variable rather than VITE_* so the error names what you have to fix.
          API_URL: ${{ vars.API_URL }}
        run: scripts/api.sh preflight

      # A push cannot supply inputs, so the bypass is unreachable from the
      # automatic path — it takes a deliberate workflow_dispatch.
      #
      # It skips the *probe*, not the validation: `validate` is the offline half,
      # and a backend outage is no reason to ship a bundle pointed at an empty or
      # scheme-less URL. And it is never silent — the run carries a warning,
      # because a skipped check that leaves no trace is the same silent-drift
      # shape issue #11 is about.
      - name: Validate API_URL without probing it
        if: ${{ inputs.skip_api_check == true }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          scripts/api.sh validate
          echo "::warning::API_URL was NOT probed for this deploy (skip_api_check); only its shape was checked. Re-run the workflow once the backend answers."

      # Runs before the build so base_path can feed Vite's `base`. Emits
      # "/energlens" for a project site and "" behind a custom domain — append
      # a slash and both become valid Vite base paths.
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Set the API_URL repository variable to your hosted backend URL
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
        run: |
          # API_URL's shape *and* reachability are checked by "Verify API_URL"
          # above, which fails the job before this step runs. Do not re-add a
          # check here: one place owns that validation, and it is the one you can
          # also run locally, with `make api-preflight`.
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
