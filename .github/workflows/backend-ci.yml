name: Backend CI

# No paths filter: backend-tests is a required status check on main, and a
# skipped workflow would leave the check stuck at "Expected", blocking merges.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy
          POSTGRES_DB: energlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Migrations apply and match the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://energy:energy@localhost:5432/energlens_test
        run: |
          # The suite builds its schema with Base.metadata.create_all, so
          # without this step Alembic is never exercised and a model change
          # with no matching revision merges green — then production, which
          # boots via `alembic upgrade head` (start.sh), starts against a
          # stale schema. `check` fails when models and revisions disagree.
          uv sync --locked
          uv run alembic upgrade head
          uv run alembic check

      - name: Backend tests
        working-directory: backend
        run: |
          # --locked, not bare `uv sync`: the latter silently re-locks in the
          # throwaway checkout, so a pyproject change without a regenerated
          # uv.lock passes CI and then fails the deploy build.
          uv sync --locked
          uv run pytest -q

      - name: Ingest tests
        working-directory: ingest
        run: |
          # --locked, not bare `uv sync`: the latter silently re-locks in the
          # throwaway checkout, so a pyproject change without a regenerated
          # uv.lock passes CI and then fails the deploy build.
          uv sync --locked
          uv run pytest -q
