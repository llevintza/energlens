name: Frontend CI

# No paths filter: frontend-build is a required status check on main, and a
# skipped workflow would leave the check stuck at "Expected", blocking merges.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
