services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d energy_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
