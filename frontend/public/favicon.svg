<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Energlens: a bolt breaking through a lens. Colours are the shipped acc,
       selink and bg tokens from src/styles/tokens.css, light then dark. The bolt
       is the dark-theme amber (#e6a23c) in both schemes, on purpose: the light
       --amber (#c47f1a) is tuned for the near-white page and goes muddy on the
       indigo tile at 16px.
       In light mode the bolt's stroke is the tile colour, so it cuts a gap where
       it crosses the ring; in dark mode the bolt and ring share the ink, so the
       amber fill carries the bolt instead. apple-touch-icon.png and favicon-32.png
       are rendered from this file. -->
  <style>
    .tile { fill: #3d3ab0; }
    .lens { stroke: #fcfcfb; }
    .bolt { fill: #e6a23c; stroke: #3d3ab0; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #8f8cf0; }
      .lens { stroke: #0d0d0d; }
      .bolt { stroke: #0d0d0d; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <circle class="lens" cx="16" cy="16" r="10" fill="none" stroke-width="3.25"/>
  <path class="bolt" d="M18.5 3 8 18h7l-2 11 11-15h-7z" stroke-width="2" stroke-linejoin="round" paint-order="stroke"/>
</svg>
