# Render Blueprint for the API. Free tier: 512 MB, spins down after 15 min idle
# (first request back takes 30-60s). Switch `plan` to `starter` for always-on.
services:
  - type: web
    name: energlens-api
    runtime: python
    plan: free
    # Must match the Neon project's region — the database is in AWS us-east-2.
    # Splitting them across the Atlantic costs ~100ms per *query*, not per
    # request, so a dashboard page issuing several sequential queries pays it
    # several times over. Move both together or not at all.
    region: ohio
    rootDir: backend
    # --locked, not --frozen: --frozen installs the committed lock without
    # checking it still matches pyproject.toml, turning lockfile drift into a
    # ModuleNotFoundError crash-loop at boot instead of a build-time error.
    buildCommand: pip install uv && uv sync --locked
    startCommand: sh ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Neon connection string — set in the dashboard, never committed.
      # Must be the DIRECT endpoint (not -pooler: pgbouncer transaction mode
      # breaks asyncpg's prepared-statement cache), and must use the
      # postgresql+asyncpg:// scheme with `?ssl=require` — `sslmode` is
      # libpq-only and asyncpg rejects it.
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      # The next two are pinned to THIS repo's Pages origin. They do not track
      # the frontend's base path (which is resolved from the Pages API at build
      # time), so change both by hand if you fork, rename the repo, or add a
      # custom domain — otherwise every XHR is blocked by CORS and the OAuth
      # callback redirects to the wrong site.

      # Origin only — no path, no trailing slash.
      - key: CORS_ORIGINS
        value: https://llevintza.github.io

      # Full base URL including the project-site path (the OAuth redirect
      # transport appends /auth/callback#access_token=... to it).
      - key: FRONTEND_URL
        value: https://llevintza.github.io/energlens

      - key: SEED_DEMO
        value: "true"
