[project]
name = "energlens-backend"
version = "0.1.0"
description = "Energlens API — energy bill tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi-users[sqlalchemy,oauth]>=14.0",
    "pydantic-settings>=2.2",
    # Declared explicitly even though fastapi-users already pulls it in for its
    # OAuth2 password form: the upload endpoint's UploadFile parsing depends on
    # it directly, and a transitive dependency is one someone else's refactor
    # can remove.
    "python-multipart>=0.0.9",
    # Page counting on upload. A PDF that fails to parse is still stored.
    "pypdf>=5.0",
    # Only imported when storage_backend="s3" — see app/storage/s3.py. Declared
    # unconditionally so switching a deployed instance to object storage is an
    # environment change, not a rebuild.
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
